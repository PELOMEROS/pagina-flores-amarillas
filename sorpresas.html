<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flores Amarillas 💛</title>

<style>

*, *::after, *::before {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}

:root {
    --dark-color: #000;
    --fl-speed: 0.8s;
    --speed-leaf: 2s;
}

body {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    min-height: 100vh;
    background-color: #02030b;
    overflow: hidden;
    perspective: 1000px;
}

/* =========================================================
   FONDO ESPACIAL NUEVO
   ========================================================= */

.night {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    filter: blur(0.1vmin);

    background:
        radial-gradient(
            ellipse at 50% 72%,
            rgba(55, 48, 105, 0.35) 0%,
            transparent 42%
        ),
        radial-gradient(
            ellipse at 20% 25%,
            rgba(80, 55, 130, 0.18) 0%,
            transparent 35%
        ),
        linear-gradient(
            to bottom,
            #02030b 0%,
            #080b20 28%,
            #101436 58%,
            #171a3e 78%,
            #0b0d21 100%
        );

    z-index: 0;
}

/* Luna difuminada a lo lejos */

.night::before {
    content: "";
    position: absolute;

    width: 30vmin;
    height: 30vmin;

    right: 10%;
    top: 12%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 32%,
            #ffffff 0%,
            #eef1ff 35%,
            #cfd6ee 63%,
            #9ba5c9 100%
        );

    opacity: 0.72;

    box-shadow:
        0 0 20px rgba(220, 230, 255, 0.55),
        0 0 60px rgba(170, 190, 255, 0.35),
        0 0 120px rgba(130, 150, 255, 0.2);

    filter: blur(1.2px);

    animation: moon-glow 6s ease-in-out infinite;
}

/* Halo de la luna */

.night::after {
    content: "";
    position: absolute;

    width: 55vmin;
    height: 55vmin;

    right: -2%;
    top: 0%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(190, 205, 255, 0.12) 0%,
            rgba(150, 170, 255, 0.07) 30%,
            transparent 68%
        );

    filter: blur(12px);

    animation: moon-halo 7s ease-in-out infinite;
}

@keyframes moon-glow {

    0%, 100% {
        opacity: 0.62;
        transform: scale(0.98);
    }

    50% {
        opacity: 0.78;
        transform: scale(1.02);
    }

}

@keyframes moon-halo {

    0%, 100% {
        opacity: 0.45;
        transform: scale(0.96);
    }

    50% {
        opacity: 0.75;
        transform: scale(1.05);
    }

}

/* =========================================================
   ESTRELLAS FIJAS DEL CIELO
   ========================================================= */

.night {
    --stars:
        radial-gradient(circle at 8% 12%, rgba(255,255,255,.8) 0 1px, transparent 2px),
        radial-gradient(circle at 17% 28%, rgba(255,255,255,.55) 0 1px, transparent 2px),
        radial-gradient(circle at 27% 9%, rgba(255,255,255,.7) 0 1px, transparent 2px),
        radial-gradient(circle at 35% 21%, rgba(255,255,255,.45) 0 1px, transparent 2px),
        radial-gradient(circle at 43% 8%, rgba(255,255,255,.8) 0 1px, transparent 2px),
        radial-gradient(circle at 52% 18%, rgba(255,255,255,.55) 0 1px, transparent 2px),
        radial-gradient(circle at 62% 7%, rgba(255,255,255,.8) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 25%, rgba(255,255,255,.5) 0 1px, transparent 2px),
        radial-gradient(circle at 78% 8%, rgba(255,255,255,.7) 0 1px, transparent 2px),
        radial-gradient(circle at 87% 30%, rgba(255,255,255,.55) 0 1px, transparent 2px),
        radial-gradient(circle at 94% 14%, rgba(255,255,255,.8) 0 1px, transparent 2px),
        radial-gradient(circle at 12% 42%, rgba(255,255,255,.4) 0 1px, transparent 2px),
        radial-gradient(circle at 31% 38%, rgba(255,255,255,.5) 0 1px, transparent 2px),
        radial-gradient(circle at 58% 36%, rgba(255,255,255,.45) 0 1px, transparent 2px),
        radial-gradient(circle at 82% 43%, rgba(255,255,255,.5) 0 1px, transparent 2px);

    background-image: var(--stars);
}

/* =========================================================
   MENSAJE DE FONDO
   ========================================================= */

.background-message {
    position: fixed;

    left: 8%;
    top: 30%;

    transform: rotate(-5deg);

    width: 38%;

    text-align: left;

    font-family: "Georgia", "Times New Roman", serif;

    font-size: clamp(28px, 4vw, 62px);

    font-weight: 400;
    font-style: italic;

    letter-spacing: 2px;
    line-height: 1.15;

    color: rgba(255, 224, 102, 0.20);

    text-shadow:
        0 0 12px rgba(255, 215, 0, 0.22),
        0 0 35px rgba(255, 215, 0, 0.13),
        0 0 70px rgba(255, 215, 0, 0.08);

    pointer-events: none;
    user-select: none;

    z-index: 1;

    animation: background-message-glow 5s ease-in-out infinite;
}

@keyframes background-message-glow {

    0%, 100% {
        opacity: 0.55;
    }

    50% {
        opacity: 1;
    }

}

/* =========================================================
   ESTRELLAS FUGACES
   ========================================================= */

.shooting-stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}

.shooting-star {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #fff;
    border-radius: 50%;

    box-shadow:
        0 0 6px 2px rgba(255, 255, 255, 0.8);

    opacity: 0;

    animation:
        shootingStar
        3s
        linear
        infinite;
}

.shooting-star::before {
    content: '';

    position: absolute;

    top: 50%;
    right: 0;

    transform: translateY(-50%);

    width: 0;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            rgba(255, 255, 255, 0),
            rgba(255, 255, 255, 1)
        );

    animation:
        shootingStarTail
        3s
        linear
        infinite;
}

.shooting-star:nth-child(1) {
    top: 5%;
    left: -10%;
    animation-delay: 0s;
    animation-duration: 2.5s;
}

.shooting-star:nth-child(2) {
    top: 15%;
    left: -10%;
    animation-delay: 2s;
    animation-duration: 3s;
}

.shooting-star:nth-child(3) {
    top: 25%;
    left: -10%;
    animation-delay: 4s;
    animation-duration: 2.8s;
}

.shooting-star:nth-child(4) {
    top: 0%;
    left: -10%;
    animation-delay: 6s;
    animation-duration: 3.2s;
}

.shooting-star:nth-child(5) {
    top: 35%;
    left: -10%;
    animation-delay: 8s;
    animation-duration: 2.7s;
}

.shooting-star:nth-child(6) {
    top: 8%;
    left: -10%;
    animation-delay: 10s;
    animation-duration: 3.1s;
}

.shooting-star:nth-child(7) {
    top: 45%;
    left: -10%;
    animation-delay: 12s;
    animation-duration: 2.9s;
}

.shooting-star:nth-child(8) {
    top: 3%;
    left: -10%;
    animation-delay: 14s;
    animation-duration: 3.3s;
}

@keyframes shootingStar {

    0% {
        opacity: 0;
        transform:
            translateX(0)
            translateY(0)
            rotate(45deg);
    }

    10% {
        opacity: 1;
    }

    90% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform:
            translateX(120vw)
            translateY(50vh)
            rotate(10deg);
    }

}

@keyframes shootingStarTail {

    0% {
        width: 0;
    }

    30% {
        width: 100px;
    }

    100% {
        width: 0;
    }

}

/* =========================================================
   FLORES
   ========================================================= */

.flowers {
    position: relative;
    transform: scale(0.9);
    z-index: 2;
}

.flower {
    position: absolute;
    bottom: 10vmin;
    transform-origin: bottom center;
    z-index: 50;
}

.flower--1 {
    animation: moving-flower-1 4s linear infinite;
}

.flower--1 .flower__line {
    height: 70vmin;
    animation-delay: 0.3s;
}

.flower--1 .flower__line__leaf--1 {
    animation: blooming-leaf-right var(--fl-speed) 1.6s backwards;
}

.flower--1 .flower__line__leaf--2 {
    animation: blooming-leaf-right var(--fl-speed) 1.4s backwards;
}

.flower--1 .flower__line__leaf--3 {
    animation: blooming-leaf-left var(--fl-speed) 1.2s backwards;
}

.flower--1 .flower__line__leaf--4 {
    animation: blooming-leaf-left var(--fl-speed) 1s backwards;
}

.flower--2 {
    left: 50%;
    transform: rotate(20deg);
    animation: moving-flower-2 4s linear infinite;
}

.flower--2 .flower__line {
    height: 60vmin;
    animation-delay: 0.6s;
}

.flower--2 .flower__line__leaf--1 {
    animation: blooming-leaf-right var(--fl-speed) 1.9s backwards;
}

.flower--2 .flower__line__leaf--2 {
    animation: blooming-leaf-right var(--fl-speed) 1.7s backwards;
}

.flower--2 .flower__line__leaf--3 {
    animation: blooming-leaf-left var(--fl-speed) 1.5s backwards;
}

.flower--2 .flower__line__leaf--4 {
    animation: blooming-leaf-left var(--fl-speed) 1.3s backwards;
}

.flower--3 {
    left: 50%;
    transform: rotate(-15deg);
    animation: moving-flower-3 4s linear infinite;
}

.flower--3 .flower__line {
    animation-delay: 0.9s;
}

.flower--3 .flower__line__leaf--1 {
    animation: blooming-leaf-right var(--fl-speed) 2.5s backwards;
}

.flower--3 .flower__line__leaf--2 {
    animation: blooming-leaf-right var(--fl-speed) 2.3s backwards;
}

.flower--3 .flower__line__leaf--3 {
    animation: blooming-leaf-left var(--fl-speed) 2.1s backwards;
}

.flower--3 .flower__line__leaf--4 {
    animation: blooming-leaf-left var(--fl-speed) 1.9s backwards;
}

.flower--4 {
    left: -25%;
    z-index: -6;
    transform: rotate(10deg);
    animation: moving-flower-4 3.5s linear infinite;
}

.flower--4 .flower__line {
    height: 90vmin;
    animation-delay: 1.2s;
}

.flower--4 .flower__line__leaf--1 {
    animation: blooming-leaf-right var(--fl-speed) 2.8s backwards;
}

.flower--4 .flower__line__leaf--2 {
    animation: blooming-leaf-right var(--fl-speed) 2.6s backwards;
}

.flower--4 .flower__line__leaf--3 {
    animation: blooming-leaf-left var(--fl-speed) 2.4s backwards;
}

.flower--4 .flower__line__leaf--4 {
    animation: blooming-leaf-left var(--fl-speed) 2.2s backwards;
}

.flower--5 {
    left: 75%;
    z-index: -7;
    transform: rotate(-25deg);
    animation: moving-flower-5 4.5s linear infinite;
}

.flower--5 .flower__line {
    height: 85vmin;
    animation-delay: 1.9s;
}

.flower--5 .flower__line__leaf--1 {
    animation: blooming-leaf-right var(--fl-speed) 2.7s backwards;
}

.flower--5 .flower__line__leaf--2 {
    animation: blooming-leaf-right var(--fl-speed) 2.5s backwards;
}

.flower--5 .flower__line__leaf--3 {
    animation: blooming-leaf-left var(--fl-speed) 2.3s backwards;
}

.flower--5 .flower__line__leaf--4 {
    animation: blooming-leaf-left var(--fl-speed) 2.1s backwards;
}

/* =========================================================
   CABEZAS DE LAS FLORES
   ========================================================= */

.flower__leafs {
    position: relative;
    animation: blooming-flower 2s backwards;
}

.flower__leafs--1 {
    animation-delay: 1.1s;
}

.flower__leafs--2 {
    animation-delay: 1.4s;
}

.flower__leafs--3 {
    animation-delay: 1.7s;
}

.flower__leafs--4 {
    animation-delay: 2.0s;
}

.flower__leafs--5 {
    animation-delay: 2.0s;
}

.flower__leafs::after {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    transform: translate(-50%, -100%);
    width: 8vmin;
    height: 8vmin;
    background-color: #6bf0ff;
    filter: blur(10vmin);
}

/* =========================================================
   PÉTALOS ORIGINALES
   ========================================================= */

.flower__leaf {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 23vmin;
    height: 6vmin;
    border-radius: 60% 40% 60% 40%;
    background-color: #ffd700;
    background-image:
        linear-gradient(
            to top,
            #ff8c00,
            #ffd700,
            #ffff00
        );
    transform-origin: bottom center;
    opacity: 0.95;

    box-shadow:
        inset 0 0 1vmin rgba(255, 255, 255, 0.7),
        0 0 3vmin rgba(255, 215, 0, 0.4);

    z-index: 2;
}

.flower__leaf--1 {
    transform: translate(-50%, -10%) rotate(-45deg);
}

.flower__leaf--2 {
    transform: translate(-50%, -10%) rotate(-15deg);
}

.flower__leaf--3 {
    transform: translate(-50%, -10%) rotate(15deg);
}

.flower__leaf--4 {
    transform: translate(-50%, -10%) rotate(45deg);
}

/* =========================================================
   CENTRO DE LA FLOR
   ========================================================= */

.flower__white-circle {
    position: absolute;
    left: -4vmin;
    top: -4vmin;
    width: 10vmin;
    height: 10vmin;
    border-radius: 50%;
    background-color: #8b4513;

    background-image:
        radial-gradient(
            circle at 30% 30%,
            #654321,
            #8b4513,
            #2f1b14
        );

    box-shadow:
        inset 0 0 2vmin rgba(0, 0, 0, 0.8),
        0 0 1vmin rgba(139, 69, 19, 0.6);
}

.flower__white-circle::after {
    content: "";
    position: absolute;
    left: 46%;
    top: 31%;
    transform: translate(-50%, -50%);
    width: 80%;
    height: 80%;
    z-index: 3;
    border-radius: inherit;

    background-image:
        repeating-conic-gradient(
            from 0deg,
            #2f1b14 0deg 15deg,
            #654321 15deg 30deg
        ),
        radial-gradient(
            circle at center,
            #8b4513,
            #654321
        );
}

/* =========================================================
   TALLOS
   ========================================================= */

.flower__line {
    height: 55vmin;
    width: 2vmin;

    background-image:
        linear-gradient(
            to left,
            rgb(0, 0, 0, 0.3),
            transparent,
            rgba(255, 255, 255, 0.2)
        ),
        linear-gradient(
            to top,
            transparent 10%,
            #2d5016,
            #4a7c23,
            #6b8e23
        );

    box-shadow:
        inset 0 0 2px rgba(0, 0, 0, 0.7);

    animation:
        grow-flower-tree
        4s
        backwards;
}

/* =========================================================
   HOJAS
   ========================================================= */

.flower__line__leaf {
    --w: 8vmin;
    --h: calc(var(--w) + 3vmin);

    position: absolute;
    top: 20%;
    left: 90%;

    width: var(--w);
    height: var(--h);

    border-top-right-radius: var(--h);
    border-bottom-left-radius: var(--h);

    background-image:
        linear-gradient(
            to top,
            rgba(45, 80, 22, 0.6),
            #4a7c23,
            #6b8e23
        );

    box-shadow:
        inset 0 0 1vmin rgba(0, 0, 0, 0.3);
}

.flower__line__leaf--1 {
    transform: rotate(70deg) rotateY(30deg);
}

.flower__line__leaf--2 {
    top: 45%;
    transform: rotate(70deg) rotateY(30deg);
}

.flower__line__leaf--3,
.flower__line__leaf--4 {
    border-top-right-radius: 0;
    border-bottom-left-radius: 0;
    border-top-left-radius: var(--h);
    border-bottom-right-radius: var(--h);
    left: -460%;
    top: 12%;
    transform: rotate(-70deg) rotateY(30deg);
}

.flower__line__leaf--4 {
    top: 40%;
}

/* =========================================================
   SEMILLAS
   ========================================================= */

.flower__light {
    position: absolute;
    bottom: 0vmin;

    width: 0.8vmin;
    height: 0.8vmin;

    background-color: #8b4513;
    border-radius: 50%;

    filter: blur(0.1vmin);

    animation:
        sunflower-seeds
        6s
        linear
        infinite
        backwards;

    box-shadow:
        0 0 1vmin rgba(139, 69, 19, 0.8);
}

.flower__light:nth-child(odd) {
    background-color: #654321;
}

.flower__light--1 {
    left: -2vmin;
    animation-delay: 1s;
}

.flower__light--2 {
    left: 3vmin;
    animation-delay: 0.5s;
}

.flower__light--3 {
    left: -6vmin;
    animation-delay: 0.3s;
}

.flower__light--4 {
    left: 6vmin;
    animation-delay: 0.9s;
}

.flower__light--5 {
    left: -1vmin;
    animation-delay: 1.5s;
}

.flower__light--6 {
    left: -4vmin;
    animation-delay: 3s;
}

.flower__light--7 {
    left: 3vmin;
    animation-delay: 2s;
}

.flower__light--8 {
    left: -6vmin;
    animation-delay: 3.5s;
}

/* =========================================================
   HIERBA ORIGINAL
   ========================================================= */

.flower__grass {
    --c: #4a7c23;
    --line-w: 2vmin;

    position: absolute;

    bottom: 12vmin;
    left: -7vmin;

    display: flex;
    flex-direction: column;
    align-items: flex-end;

    z-index: 20;

    transform-origin: bottom center;

    transform:
        rotate(-48deg)
        rotateY(40deg);
}

.flower__grass--1 {
    animation:
        moving-grass
        2s
        linear
        infinite;
}

.flower__grass--2 {
    left: 2vmin;
    bottom: 10vmin;

    transform:
        scale(0.5)
        rotate(75deg)
        rotateX(10deg)
        rotateY(-200deg);

    opacity: 0.8;
    z-index: 0;

    animation:
        moving-grass--2
        1.5s
        linear
        infinite;
}

.flower__grass--3 {
    left: -25vmin;
    bottom: 8vmin;

    transform:
        scale(0.7)
        rotate(-30deg)
        rotateY(45deg);

    opacity: 0.9;
    z-index: 15;

    animation:
        moving-grass--3
        2.2s
        linear
        infinite;
}

.flower__grass--4 {
    left: -35vmin;
    bottom: 15vmin;

    transform:
        scale(0.4)
        rotate(60deg)
        rotateX(15deg)
        rotateY(-180deg);

    opacity: 0.7;
    z-index: 5;

    animation:
        moving-grass--4
        1.8s
        linear
        infinite;
}

.flower__grass--5 {
    left: -18vmin;
    bottom: 6vmin;

    transform:
        scale(0.6)
        rotate(-60deg)
        rotateY(60deg);

    opacity: 0.85;
    z-index: 12;

    animation:
        moving-grass--5
        2.5s
        linear
        infinite;
}

.flower__grass--6 {
    left: 25vmin;
    bottom: 9vmin;

    transform:
        scale(0.65)
        rotate(35deg)
        rotateY(-45deg);

    opacity: 0.9;
    z-index: 15;

    animation:
        moving-grass--6
        2.3s
        linear
        infinite;
}

.flower__grass--7 {
    left: 35vmin;
    bottom: 14vmin;

    transform:
        scale(0.45)
        rotate(-70deg)
        rotateX(20deg)
        rotateY(170deg);

    opacity: 0.75;
    z-index: 8;

    animation:
        moving-grass--7
        1.9s
        linear
        infinite;
}

.flower__grass--8 {
    left: 18vmin;
    bottom: 5vmin;

    transform:
        scale(0.55)
        rotate(50deg)
        rotateY(-70deg);

    opacity: 0.8;
    z-index: 10;

    animation:
        moving-grass--8
        2.1s
        linear
        infinite;
}

.flower__grass--9 {
    left: -45vmin;
    bottom: 20vmin;

    transform:
        scale(0.3)
        rotate(20deg)
        rotateY(90deg);

    opacity: 0.6;
    z-index: 2;

    animation:
        moving-grass--9
        1.6s
        linear
        infinite;
}

.flower__grass--10 {
    left: 42vmin;
    bottom: 18vmin;

    transform:
        scale(0.35)
        rotate(-45deg)
        rotateY(-120deg);

    opacity: 0.65;
    z-index: 3;

    animation:
        moving-grass--10
        2s
        linear
        infinite;
}

.flower__grass--top {
    width: 7vmin;
    height: 10vmin;

    border-top-right-radius: 100%;
    border-right: var(--line-w) solid var(--c);

    transform-origin: bottom center;
    transform: rotate(-2deg);
}

.flower__grass--bottom {
    margin-top: -2px;

    width: var(--line-w);
    height: 25vmin;

    background-image:
        linear-gradient(
            to top,
            transparent,
            var(--c)
        );
}

.flower__grass__leaf {
    --size: 10vmin;

    position: absolute;

    width: calc(var(--size) * 2.1);
    height: var(--size);

    border-top-left-radius: var(--size);
    border-top-right-radius: var(--size);

    background-image:
        linear-gradient(
            to top,
            transparent,
            transparent 30%,
            var(--c)
        );

    z-index: 100;
}

.flower__grass__leaf--1 {
    top: -6%;
    left: 30%;
    --size: 6vmin;

    transform: rotate(-20deg);

    animation:
        growing-grass-ans--1
        var(--speed-leaf)
        2.6s
        backwards;
}

.flower__grass__leaf--2 {
    top: -5%;
    left: -110%;
    --size: 6vmin;

    transform: rotate(10deg);

    animation:
        growing-grass-ans--2
        var(--speed-leaf)
        2.4s
        linear
        backwards;
}

.flower__grass__leaf--3 {
    top: 5%;
    left: 60%;
    --size: 8vmin;

    transform:
        rotate(-18deg)
        rotateX(-20deg);

    animation:
        growing-grass-ans--3
        var(--speed-leaf)
        2.2s
        linear
        backwards;
}

.flower__grass__leaf--4 {
    top: 6%;
    left: -135%;
    --size: 8vmin;

    transform: rotate(2deg);

    animation:
        growing-grass-ans--4
        var(--speed-leaf)
        2s
        linear
        backwards;
}

.flower__grass__leaf--5 {

<!-- =====================================================

     ===================================================== -->

<script>

window.onload = () => {

    setTimeout(() => {

        document.body.classList.remove(
            "not-loaded"
        );

        /* =================================================
           ESTRELLAS FUGACES
           ================================================= */

        function createShootingStar() {

            const star =
                document.createElement("div");

            star.className =
                "shooting-star";

            star.style.top =
                Math.random() * 60 + "%";

            star.style.animationDelay =
                "0s";

            star.style.animationDuration =
                (Math.random() * 1.5 + 2) + "s";

            document
                .querySelector(".shooting-stars")
                .appendChild(star);

            setTimeout(() => {

                star.remove();

            }, 4000);

        }

        setInterval(() => {

            if (Math.random() > 0.3) {

                createShootingStar();

            }

        }, Math.random() * 5000 + 3000);

        /* =================================================
           PÉTALOS VOLANDO
           ================================================= */

        const petalsContainer =
            document.getElementById(
                "fallingPetals"
            );

        function createFallingPetal() {

            const flowers =
                document.querySelectorAll(
                    ".flower__leafs"
                );

            if (!flowers.length) {
                return;
            }

            const source =
                flowers[
                    Math.floor(
                        Math.random() *
                        flowers.length
                    )
                ];

            const rect =
                source.getBoundingClientRect();

            const petal =
                document.createElement("span");

            petal.className =
                "falling-petal";

            const startX =
                rect.left +
                rect.width / 2 +
                (
                    Math.random() * 35 -
                    17
                );

            const startY =
                rect.top +
                rect.height * 0.15;

            petal.style.left =
                startX + "px";

            petal.style.top =
                startY + "px";

            const drift =
                100 +
                Math.random() * 180;

            const direction =
                Math.random() > 0.25
                    ? 1
                    : -1;

            petal.style.setProperty(
                "--drift",
                (drift * direction) + "px"
            );

            petal.style.setProperty(
                "--rotate",
                (
                    Math.random() * 900 -
                    450
                ) + "deg"
            );

            const duration =
                4 +
                Math.random() * 4;

            petal.style.setProperty(
                "--duration",
                duration + "s"
            );

            petalsContainer.appendChild(
                petal
            );

            setTimeout(() => {

                petal.remove();

            }, duration * 1000 + 300);

        }

        function petalLoop() {

            createFallingPetal();

            setTimeout(
                petalLoop,
                650 +
                Math.random() * 1100
            );

        }

        setTimeout(
            petalLoop,
            1800
        );

        /* =================================================
           CERRAR CARTA
           ================================================= */

        const closeLetter =
            document.getElementById(
                "closeLetter"
            );

        const letterOverlay =
            document.getElementById(
                "letterOverlay"
            );

        closeLetter.addEventListener(
            "click",
            () => {

                letterOverlay.classList.add(
                    "hidden"
                );

            }
        );

    }, 1000);

};

</script>
